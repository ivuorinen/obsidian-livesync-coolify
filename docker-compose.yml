---
services:
  couchdb:
    build:
      context: .
      dockerfile: Dockerfile
      target: couchdb
    environment:
      - COUCHDB_USER=${COUCHDB_ADMIN_USER:-admin}
      # "COUCHDBADMIN", not "COUCHDB_ADMIN": Coolify only generates a
      # SERVICE_PASSWORD_* value when the whole variable name has three
      # underscores or fewer, so an underscore inside the identifier makes it
      # silently empty — and CouchDB then exits at startup with a banner no
      # deployment log shows you. Keep every identifier a single word.
      - COUCHDB_PASSWORD=${SERVICE_PASSWORD_64_COUCHDBADMIN}
      - SERVICE_FQDN_COUCHDB_5984
    volumes:
      - couchdb-data:/opt/couchdb/data
    expose:
      - "5984"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --user "$$COUCHDB_USER:$$COUCHDB_PASSWORD"
          http://127.0.0.1:5984/_session | grep -q '"ok":true'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  couchdb-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    environment:
      - COUCHDB_INTERNAL_URL=http://couchdb:5984
      - COUCHDB_ADMIN_USER=${COUCHDB_ADMIN_USER:-admin}
      - COUCHDB_ADMIN_PASSWORD=${SERVICE_PASSWORD_64_COUCHDBADMIN}
      #
      # One vault database per person: alice gets vault-alice, and only alice
      # can reach it. The roster is a Coolify variable, so edit it there.
      #
      # To add someone, do both and redeploy:
      #   1. append their name to LIVESYNC_USERS in Coolify
      #   2. add one LIVESYNC_PASSWORD_<NAME> line below referencing a
      #      SERVICE_PASSWORD_64_<NAME> variable, which Coolify generates
      #
      # For example, adding alice and bob:
      #   LIVESYNC_USERS=livesync,alice,bob   (Coolify variable)
      #   - LIVESYNC_PASSWORD_ALICE=${SERVICE_PASSWORD_64_ALICE}
      #   - LIVESYNC_PASSWORD_BOB=${SERVICE_PASSWORD_64_BOB}
      #
      # A name added without its password line is a startup error naming the
      # missing variable, not a silently half-provisioned person.
      - LIVESYNC_USERS=${LIVESYNC_USERS:-livesync}
      - LIVESYNC_PASSWORD_LIVESYNC=${SERVICE_PASSWORD_64_LIVESYNC}
      - CORS_ORIGINS=${CORS_ORIGINS:-app://obsidian.md,capacitor://localhost,http://localhost}
    depends_on:
      couchdb:
        condition: service_healthy
    # Bounded: every failure mode of this service is permanent (an invalid
    # database name, a missing generated password, an unreachable CouchDB),
    # so unlimited retries only hide a terminal error behind a container that
    # looks perpetually "starting" instead of failed.
    restart: on-failure:3
    exclude_from_hc: true

volumes:
  couchdb-data:
