---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # scripts/validate.sh is the single definition of what gets checked; it
      # skips any linter that is absent, so CI's only job here is to make them
      # present. hadolint and actionlint ship as containers rather than apt
      # packages, so they are wrapped as shims instead of pinning a download
      # URL that would rot silently.
      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck yamllint
          mkdir -p "$HOME/.local/bin"
          # Quoted heredocs: $PWD and $@ must expand when the shim runs, not now.
          cat > "$HOME/.local/bin/hadolint" <<'SHIM'
          #!/usr/bin/env bash
          exec docker run --rm -v "$PWD:/w" -w /w \
            hadolint/hadolint:v2.15.1 hadolint "$@"
          SHIM
          cat > "$HOME/.local/bin/actionlint" <<'SHIM'
          #!/usr/bin/env bash
          exec docker run --rm -v "$PWD:/w" -w /w \
            rhysd/actionlint:1.7.12 -color "$@"
          SHIM
          chmod +x "$HOME/.local/bin/hadolint" "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        run: ./scripts/validate.sh

      # CI-only, because both are slow enough that running them on every local
      # validate.sh would train contributors to skip the script.
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 dir /repo --no-banner --redact

      # Both images are always scanned, and the step fails at the end rather
      # than on the first bad image: aborting early meant only ever learning
      # about whichever image happened to be scanned first.
      # Suppressions live in .trivyignore.yaml, each justified and dated.
      - name: Scan built images for known vulnerabilities
        run: |
          failed=0
          for image in obsidian-livesync-couchdb:validate obsidian-livesync-init:validate; do
            echo "::group::trivy $image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/repo" -w /repo \
              aquasec/trivy:0.74.0 image \
              --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile /repo/.trivyignore.yaml \
              --exit-code 1 "$image" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
