; Static CouchDB configuration for Obsidian Self-hosted LiveSync.
;
; Only settings that must be in place before the couchdb-init service runs
; belong here. Authentication, CORS, and size limits are applied at runtime by
; that service, which is the only place able to honour CORS_ORIGINS. Do not
; restate them in this file: CouchDB loads local.d/docker.ini after local.ini,
; so a copy here is silently overridden and leaves the repository documenting
; an allow-list the server does not enforce.

[couchdb]
single_node = true
default_security = admin_only

[cluster]
; One node means one replica. Left at CouchDB's default of 3, every database
; creation requests three replicas, logs "Request to create N=3 DB but only
; 1 node(s)" at error level, and is clamped to 1 anyway — training the reader
; to ignore the log that matters when something is actually wrong.
n = 1

[chttpd]
bind_address = 0.0.0.0
port = 5984
server_header_versions = false

[httpd]
WWW-Authenticate = Basic realm="couchdb"

[log]
level = warning
